<html>

        <title>Sign Up - CloudBooks</title>

    <body>
 <h2 style="text-align: center;">Create Your Account</h2>
 <form class="lr-form">
 <label for="user-reg">Username:</label>
 <input type="text" id="user-reg" name="user-reg"placeholder="username" required><br>

 <label for="email-reg">Email:</label>
 <input type="email" id="email-reg" name="email-reg" placeholder="example@domain.com" required><br>
 
  <label for="password-reg">Password:</label>
 <input type="password" id="password-reg" name="password-reg" placeholder="****" required><br>

  <label for="re-password-reg" >Confirm Password:</label>
 <input type="password" id="re-password-reg" name="re-password-reg" placeholder="****" required><br>
<p>By signing up you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html"> Privacy Policy</a></p>
<p>Already have an account?<a href="login.html"> Sign in</a></p>

 <input type="submit" value="Sign up">


 </form>
    </body>

</html>
